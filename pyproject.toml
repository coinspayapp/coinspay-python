[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coinspay"
version = "0.1.0"
description = "Official Python library for the CoinsPay crypto payments API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["coinspay", "crypto", "payments", "invoices", "webhooks", "usdt", "bitcoin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://coinspay.app"
Documentation = "https://coinspay.app/docs"
Source = "https://github.com/coinspayapp/coinspay-python"
Issues = "https://github.com/coinspayapp/coinspay-python/issues"
Changelog = "https://github.com/coinspayapp/coinspay-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coinspay = ["py.typed"]

[tool.mypy]
python_version = "3.8"
strict = true
